    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.7
  freezed: ^2.4.7
  retrofit_generator: ^8.1.0
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  analyzer: ^6.4.1

flutter:

  uses-material-design: true

